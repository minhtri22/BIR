services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bfp
      POSTGRES_USER: bfp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bfp_dev_password}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfp -d bfp"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://bfp:${POSTGRES_PASSWORD:-bfp_dev_password}@db:5432/bfp
      REDIS_URL: redis://redis:6379/0
      DEV_SEED_EMAIL: ${DEV_SEED_EMAIL:-admin@example.com}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:?Set DEV_SEED_PASSWORD for the development seed user}
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      COOKIE_SECURE: "false"
      AUTO_CREATE_DB: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://bfp:${POSTGRES_PASSWORD:-bfp_dev_password}@db:5432/bfp
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
